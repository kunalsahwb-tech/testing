[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ad"
version = "0.1.0"
description = "AEGIS-AD — Preventive AI Safety System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AEGIS-AD Team" }
]
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
