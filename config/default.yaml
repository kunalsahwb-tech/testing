app:
  name: "AEGIS-AD Preventive AI Safety System"
  version: "0.1.0"
  env: "development"
  debug: false

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  log_file: "logs/aegis_ad.log"

detection:
  model_path: "yolo26n.pt"        # Pretrained YOLO26 nano model
  confidence_threshold: 0.25
  image_size: 640
  device: "cpu"                   # Use "cuda" if a compatible GPU is available
  # Classes filtered from COCO-80: person, bicycle, car, motorcycle, bus, truck
  target_classes:
    - 0   # person
    - 1   # bicycle
    - 2   # car
    - 3   # motorcycle
    - 5   # bus
    - 7   # truck

tracking:
  track_high_thresh: 0.5   # Minimum confidence for high-confidence track activation
  track_low_thresh: 0.1    # Minimum confidence for low-confidence candidate matching
  new_track_thresh: 0.6    # Minimum confidence to start a new track
  track_buffer: 30         # Frames to retain a lost track before removing it
  match_thresh: 0.8        # IoU threshold for matching detections to existing tracks

events:
  enabled: true
  person_class_id: 0
  dwell_threshold_seconds: 30.0
  absence_grace_seconds: 1.0
  # Note: Polygon coordinates are normalized [0.0, 1.0] and serve as an illustrative
  # example for CAM_01. Operators must calibrate zones to match the actual camera view.
  zones:
    - zone_id: "restricted_zone_01"
      name: "Restricted Area"
      camera_id: "CAM_01"
      polygon:
        - [0.65, 0.25]
        - [0.95, 0.25]
        - [0.95, 0.95]
        - [0.65, 0.95]

paths:
  data_dir: "data"
  videos_dir: "data/videos"
  evidence_dir: "data/evidence"
  snapshots_dir: "data/snapshots"
  logs_dir: "logs"
